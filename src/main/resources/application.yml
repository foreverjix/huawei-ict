server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mindflow
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: jdbc:h2:file:./data/mindflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFRAG_ALWAYS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

logging:
  level:
    com.mindflow: debug
mindflow:
  storage:
    root: ./data/uploads
  llm:
    default-base-url: https://api.deepseek.com/v1
    default-model: deepseek-chat