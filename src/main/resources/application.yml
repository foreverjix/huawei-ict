server:
  port: 8080
  address: ${MINDFLOW_BIND_ADDRESS:127.0.0.1}
  shutdown: graceful

spring:
  application:
    name: mindflow
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: jdbc:h2:file:./data/mindflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFRAG_ALWAYS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${MINDFLOW_H2_CONSOLE:false}
      path: /h2-console
      settings:
        web-allow-others: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

logging:
  level:
    com.mindflow: debug

mindflow:
  storage:
    root: ./data/uploads
  llm:
    default-base-url: ${MINDFLOW_LLM_BASE_URL:https://api.deepseek.com/v1}
    default-model: ${MINDFLOW_LLM_MODEL:deepseek-chat}
  ocr:
    enabled: ${MINDFLOW_OCR_ENABLED:false}
    endpoint: ${MINDFLOW_OCR_ENDPOINT:}
    region: ${MINDFLOW_OCR_REGION:cn-north-4}
    project-id: ${MINDFLOW_OCR_PROJECT_ID:}
    ak: ${MINDFLOW_OCR_AK:}
    sk: ${MINDFLOW_OCR_SK:}
    max-pages: ${MINDFLOW_OCR_MAX_PAGES:10}
    dpi: ${MINDFLOW_OCR_DPI:150}